<svg width="1600" height="480" viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="18%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0c1f26"/>
      <stop offset="60%" stop-color="#061319"/>
      <stop offset="100%" stop-color="#02070a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ff9ff"/>
      <stop offset="100%" stop-color="#33d9ec"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="480" fill="url(#bg)"/>

  <!-- badge -->
  <g transform="translate(60,60) scale(0.36)">
    <circle cx="512" cy="512" r="392" fill="none" stroke="url(#cyan)" stroke-width="10" opacity="0.95" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="352" fill="none" stroke="#4df3ff" stroke-width="3" opacity="0.35"/>
    <g stroke="#8ff9ff" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)">
      <line x1="512" y1="76"  x2="512" y2="132"/>
      <line x1="512" y1="892" x2="512" y2="948"/>
      <line x1="76"  y1="512" x2="132" y2="512"/>
      <line x1="892" y1="512" x2="948" y2="512"/>
    </g>
    <circle cx="770" cy="256" r="16" fill="#8ff9ff" filter="url(#softGlow)"/>
    <g filter="url(#glow)">
      <g fill="url(#cyan)">
        <rect x="368" y="300" width="96"  height="424" rx="10"/>
        <rect x="368" y="300" width="288" height="90"  rx="10"/>
        <rect x="368" y="467" width="248" height="82"  rx="10"/>
        <rect x="368" y="634" width="288" height="90"  rx="10"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g filter="url(#glow)">
    <text x="430" y="255" font-family="Courier New, ui-monospace, monospace" font-size="112" font-weight="700"
          letter-spacing="10" fill="url(#cyan)">E.D.I.T.H.</text>
  </g>
  <text x="432" y="305" font-family="Courier New, ui-monospace, monospace" font-size="30"
        letter-spacing="6" fill="#6fa3ab">EVEN DEAD, I'M THE HERO</text>

  <!-- underline accent -->
  <line x1="432" y1="330" x2="1500" y2="330" stroke="#1c5a63" stroke-width="2"/>
</svg>
