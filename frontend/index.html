<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E.D.I.T.H.</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/favicon.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="scanlines"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">E.D.I.T.H.</span>
      <span class="brand-sub">Even Dead, I'm The Hero</span>
    </div>
    <div class="status-cluster">
      <div class="status-pill" id="statusVision"><span class="dot"></span>VISION</div>
      <div class="status-pill" id="statusVoice"><span class="dot"></span>VOICE</div>
      <div class="status-pill" id="statusBrain"><span class="dot"></span>CORE</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <main class="grid">
    <section class="panel camera-panel">
      <div class="panel-title">OPTICAL FEED</div>
      <div class="camera-frame">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="camera-off-msg" id="cameraOffMsg">CAMERA OFFLINE — click START to engage</div>
      </div>
      <div class="camera-controls">
        <button id="startBtn" class="btn btn-primary">START SYSTEM</button>
        <button id="micBtn" class="btn" disabled>MIC: OFF</button>
        <div class="enroll-row">
          <input id="enrollName" type="text" placeholder="Subject name" />
          <button id="enrollBtn" class="btn" disabled>ENROLL FACE</button>
        </div>
      </div>
    </section>

    <section class="panel console-panel">
      <div class="panel-title">CONSOLE</div>
      <div class="transcript" id="transcript">
        <div class="line system">E.D.I.T.H. standing by. Say "Edith" followed by a command, or type below.</div>
      </div>
      <form id="textForm" class="text-form">
        <input id="textInput" type="text" placeholder="Type a command..." autocomplete="off" />
        <button type="submit" class="btn btn-primary">SEND</button>
      </form>
    </section>

    <section class="panel log-panel">
      <div class="panel-title">SIGHTING LOG</div>
      <ul class="log-list" id="logList"></ul>
      <div class="panel-title" style="margin-top:14px;">KNOWN SUBJECTS</div>
      <ul class="face-list" id="faceList"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
