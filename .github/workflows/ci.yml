name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Byte-compile all Python sources
        run: python -m py_compile backend/*.py

      - name: Import FastAPI app (smoke test)
        working-directory: backend
        run: python -c "import main; print('app routes:', len(main.app.routes))"

  frontend:
    name: Frontend (JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax
        run: |
          for f in frontend/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
